name: Build Fastfetch for MIPS (Xiaomi Mi Router 3G MT7621)

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Check build trigger
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.trigger.outputs.should_build }}
      should_release: ${{ steps.trigger.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Match the exact build trigger
        id: trigger
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif python3 scripts/ci/common/ci-trigger.py --message "$COMMIT_MESSAGE" --token build-release; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif python3 scripts/ci/common/ci-trigger.py --message "$COMMIT_MESSAGE" --token build-action; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      asset_name: ${{ steps.metadata.outputs.asset_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      sha256: ${{ steps.metadata.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential wget zstd

      - name: Download and set up OpenWrt SDK
        run: |
          echo "::group::Downloading OpenWrt SDK"
          wget -q --show-progress https://downloads.openwrt.org/releases/24.10.7/targets/ramips/mt7621/openwrt-sdk-24.10.7-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          echo "::endgroup::"

          echo "::group::Extracting SDK"
          tar --zstd -xf openwrt-sdk-24.10.7-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          echo "SDK_ROOT=$(pwd)/openwrt-sdk-24.10.7-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64" >> "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Compile Fastfetch
        run: |
          export SYSROOT="$SDK_ROOT/staging_dir/toolchain-mipsel_24kc_gcc-13.3.0_musl"
          export PATH="$SYSROOT/bin:$PATH"
          export STAGING_DIR="$SDK_ROOT/staging_dir"

          cmake -S . -B build_mips \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=mips \
            -DCMAKE_C_COMPILER=mipsel-openwrt-linux-gcc \
            -DCMAKE_STAGING_PREFIX="$SDK_ROOT/staging_dir/target-mipsel_24kc_musl" \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_C_FLAGS="--sysroot=$SYSROOT -msoft-float -mips32r2 -nostdinc -I$SYSROOT/include -I$SYSROOT/usr/include" \
            -DSET_TWEAK=OFF \
            -DENABLE_ZLIB=OFF \
            -DENABLE_SQLITE3=OFF \
            -DENABLE_DRM=OFF -DENABLE_X11=OFF -DENABLE_WAYLAND=OFF -DENABLE_VULKAN=OFF -DENABLE_DBUS=OFF -DENABLE_PCI=OFF

          cmake --build build_mips --parallel
          "$SYSROOT/bin/mipsel-openwrt-linux-strip" build_mips/fastfetch

      - name: Prepare versioned artifact
        id: metadata
        run: |
          version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build_mips/CMakeCache.txt)
          test -n "$version"

          short_sha=$(git rev-parse --short=8 HEAD)
          asset_name="fastfetch-linux-mipsel-mt7621-${version}-${short_sha}"
          release_tag="mt7621-${version}-${short_sha}"

          mv build_mips/fastfetch "build_mips/$asset_name"
          sha256=$(sha256sum "build_mips/$asset_name" | awk '{print $1}')

          {
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "asset_name=$asset_name"
            echo "release_tag=$release_tag"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.asset_name }}
          path: build_mips/${{ steps.metadata.outputs.asset_name }}

  release:
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.asset_name }}
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: Fastfetch ${{ needs.build.outputs.version }} for MT7621
          files: release/${{ needs.build.outputs.asset_name }}
          body: |
            ### Fastfetch for Xiaomi Mi Router 3G (MT7621)

            - Fastfetch version: `${{ needs.build.outputs.version }}`
            - Architecture: `mipsel` (MT7621 / MIPS 1004Kc)
            - OpenWrt SDK: `24.10.7`
            - Source commit: `${{ github.sha }}`
            - Build type: `static`
            - SHA-256: `${{ needs.build.outputs.sha256 }}`
          draft: false
          prerelease: false
