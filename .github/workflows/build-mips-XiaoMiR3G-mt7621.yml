name: Build Fastfetch for MIPS (小米路由器 XiaoMi R3G MT7621)

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential xz-utils wget

      - name: Download & Setup OpenWrt SDK
        run: |
          echo "::group::Downloading OpenWrt SDK"
          # 使用 -q 减少输出，--show-progress 仅保留进度条
          wget -q --show-progress https://downloads.openwrt.org/releases/23.05.4/targets/ramips/mt7621/openwrt-sdk-23.05.4-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          echo "::endgroup::"
          
          echo "::group::Extracting SDK"
          # 解压
          tar -xJf openwrt-sdk-23.05.4-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          # 设置环境变量
          echo "SDK_ROOT=$(pwd)/openwrt-sdk-23.05.4-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: Compile Fastfetch
        run: |
          # 核心环境变量设置
          export SYSROOT=$SDK_ROOT/staging_dir/toolchain-mipsel_24kc_gcc-12.3.0_musl
          export PATH=$SYSROOT/bin:$PATH
          export STAGING_DIR=$SDK_ROOT/staging_dir
          
          mkdir build_mips && cd build_mips
          
          # 增加 -DENABLE_SQLITE3=OFF 修复报错
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=mips \
            -DCMAKE_C_COMPILER=mipsel-openwrt-linux-gcc \
            -DCMAKE_STAGING_PREFIX=$SDK_ROOT/staging_dir/target-mipsel_24kc_musl \
            -DCMAKE_FIND_ROOT_PATH=$SYSROOT \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_C_FLAGS="--sysroot=$SYSROOT -msoft-float -mips32r2 -nostdinc -I$SYSROOT/include -I$SYSROOT/usr/include" \
            -DENABLE_ZLIB=OFF \
            -DENABLE_SQLITE3=OFF \
            -DENABLE_DRM=OFF \
            -DENABLE_X11=OFF \
            -DENABLE_WAYLAND=OFF \
            -DENABLE_VULKAN=OFF \
            -DENABLE_DBUS=OFF \
            -DENABLE_PCI=OFF
          
          make -j$(nproc)
          
          # 瘦身并重命名，方便识别
          mipsel-openwrt-linux-strip fastfetch
          mv fastfetch fastfetch-linux-mipsel-mt7621

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-mips-xiaomi-r3g
          path: build_mips/fastfetch-linux-mipsel-mt7621
